<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#1478ff">
  <title>MPLH 26: Tower Top 3D</title>
  <meta name="description" content="Official download page for MPLH 26: Tower Top 3D.">
  <style>
    :root{
      --bg1:#0d6efd;
      --bg2:#46c7ff;
      --card:rgba(255,255,255,.94);
      --text:#142033;
      --muted:#617087;
      --shadow:0 18px 55px rgba(0,0,0,.22);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.33), transparent 28%),
        linear-gradient(145deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 16px;
    }
    .wrap{
      width:min(760px,100%);
      background:var(--card);
      border-radius:28px;
      padding:clamp(24px,5vw,46px);
      box-shadow:var(--shadow);
      text-align:center;
    }
    .badge{
      display:inline-block;
      padding:7px 12px;
      border-radius:999px;
      background:#eaf4ff;
      color:#0d63ce;
      font-weight:800;
      letter-spacing:.04em;
      font-size:.82rem;
      margin-bottom:14px;
    }
    h1{
      margin:0;
      font-size:clamp(2.2rem,7vw,4.8rem);
      line-height:.98;
    }
    .subtitle{
      color:var(--muted);
      margin:16px auto 26px;
      max-width:560px;
      font-size:1.08rem;
      line-height:1.6;
    }
    .buttons{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
      max-width:520px;
      margin:0 auto;
    }
    .store{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:16px 18px;
      border-radius:16px;
      text-decoration:none;
      font-weight:800;
      font-size:1.05rem;
      transition:.18s transform,.18s box-shadow,.18s opacity;
      border:0;
    }
    .store:hover{transform:translateY(-2px)}
    .google{
      background:#111827;
      color:white;
      box-shadow:0 10px 24px rgba(17,24,39,.22);
    }
    .apple{
      background:#ffffff;
      color:#111827;
      border:2px solid #dbe3ee;
      box-shadow:0 10px 24px rgba(17,24,39,.10);
    }
    .disabled{
      opacity:.45;
      pointer-events:none;
      filter:grayscale(.35);
    }
    .note{
      margin-top:20px;
      font-size:.9rem;
      color:var(--muted);
    }
    .links{
      margin-top:28px;
      display:flex;
      justify-content:center;
      gap:18px;
      flex-wrap:wrap;
      font-size:.92rem;
    }
    .links a{color:#0d63ce;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="badge">OFFICIAL DOWNLOAD PAGE</div>
    <h1>MPLH 26<br>Tower Top 3D</h1>

    <p class="subtitle">
      Stack colorful 3D towers, chase perfect drops, and play thousands of levels
      or Free Mode with 1–9 towers.
    </p>

    <div class="buttons">
      <a id="googlePlayBtn" class="store google" href="#" rel="noopener noreferrer">
        ▶ Get it on Google Play
      </a>

      <a id="appStoreBtn" class="store apple" href="#" rel="noopener noreferrer">
         Download on the App Store
      </a>
    </div>

    <p id="availabilityNote" class="note"></p>

    <div class="links">
      <a href="./">Privacy Policy</a>
    </div>
  </main>

  <script>
    // EDIT ONLY THESE TWO VALUES BEFORE PUBLISHING.
    const GOOGLE_PLAY_URL =
      "https://play.google.com/store/apps/details?id=YOUR.PACKAGE.NAME";

    const APP_STORE_URL =
      "https://apps.apple.com/app/idYOUR_APPLE_ID";

    const googleBtn = document.getElementById("googlePlayBtn");
    const appleBtn = document.getElementById("appStoreBtn");
    const note = document.getElementById("availabilityNote");

    function isPlaceholder(url) {
      return url.includes("YOUR.PACKAGE.NAME") || url.includes("YOUR_APPLE_ID");
    }

    if (isPlaceholder(GOOGLE_PLAY_URL)) {
      googleBtn.classList.add("disabled");
      googleBtn.textContent = "Google Play — Coming Soon";
    } else {
      googleBtn.href = GOOGLE_PLAY_URL;
    }

    if (isPlaceholder(APP_STORE_URL)) {
      appleBtn.classList.add("disabled");
      appleBtn.textContent = "App Store — Coming Soon";
    } else {
      appleBtn.href = APP_STORE_URL;
    }

    const ua = navigator.userAgent || "";
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);

    if (isAndroid && !isPlaceholder(GOOGLE_PLAY_URL)) {
      googleBtn.style.outline = "4px solid rgba(20,120,255,.24)";
      note.textContent = "Google Play is available for this device.";
    } else if (isIOS && !isPlaceholder(APP_STORE_URL)) {
      appleBtn.style.outline = "4px solid rgba(20,120,255,.24)";
      note.textContent = "The App Store is available for this device.";
    } else if (isPlaceholder(GOOGLE_PLAY_URL) || isPlaceholder(APP_STORE_URL)) {
      note.textContent = "Store links will become active as soon as they are published.";
    }
  </script>
</body>
</html>
